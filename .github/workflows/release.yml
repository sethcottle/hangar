# SPDX-License-Identifier: MPL-2.0

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 0.2.0, 1.0.0). Leave empty for nightly.'
        required: false
        type: string

jobs:
  build-flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate Cargo sources
        run: |
          pip3 install toml tomlkit aiohttp
          curl -sSL https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py -o flatpak-cargo-generator.py
          python3 flatpak-cargo-generator.py Cargo.lock -o cargo-sources.json

      - name: Apply nightly identity
        if: inputs.version == ''
        run: ./scripts/devel-identity.sh

      - name: Stamp the build version
        run: |
          # Same HANGAR_VERSION as the AppImage, threaded through the
          # manifest's env block so the About dialog matches the release.
          if [ -n "${{ inputs.version }}" ]; then
            V="${{ inputs.version }}"
          else
            V="nightly-$(date +%Y%m%d)-${GITHUB_SHA::7}"
          fi
          sed -i "s/^    RUST_BACKTRACE: '1'$/    RUST_BACKTRACE: '1'\n    HANGAR_VERSION: '${V}'/" io.github.sethcottle.Hangar.yml
          grep -q "HANGAR_VERSION" io.github.sethcottle.Hangar.yml || { echo "version stamp missed the manifest" >&2; exit 1; }

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6.7
        with:
          manifest-path: io.github.sethcottle.Hangar.yml
          bundle: ${{ inputs.version != '' && 'hangar.flatpak' || 'hangar-nightly.flatpak' }}
          upload-artifact: false
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v7
        with:
          name: hangar-flatpak
          path: hangar*.flatpak

  build-appimage:
    name: Build AppImage
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libsecret-1-dev \
            librsvg2-dev \
            libfuse2 \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: |
          # HANGAR_VERSION lands in the About dialog via build.rs.
          if [ -n "${{ inputs.version }}" ]; then
            HANGAR_VERSION="${{ inputs.version }}" cargo build --release
          else
            HANGAR_VERSION="nightly-$(date +%Y%m%d)-${GITHUB_SHA::7}"               cargo build --release --features devel
          fi

      - name: Download appimagetool
        run: |
          curl -sSL https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o appimagetool
          chmod +x appimagetool

      - name: Determine app identity
        id: identity
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "app_id=io.github.sethcottle.Hangar" >> $GITHUB_OUTPUT
          else
            ./scripts/devel-identity.sh
            echo "app_id=io.github.sethcottle.Hangar.Devel" >> $GITHUB_OUTPUT
          fi

      - name: Create AppDir structure
        run: |
          APP_ID="${{ steps.identity.outputs.app_id }}"
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps
          mkdir -p AppDir/usr/share/metainfo

          cp target/release/hangar AppDir/usr/bin/
          cp "data/${APP_ID}.desktop" AppDir/usr/share/applications/
          cp "data/${APP_ID}.metainfo.xml" AppDir/usr/share/metainfo/
          cp "assets/icons/${APP_ID}.svg" AppDir/usr/share/icons/hicolor/scalable/apps/

          # Raster sizes for desktops whose SVG renderer cannot draw the
          # scalable icon's filters (KDE turns them into black plates).
          for size in 16 32 48 64 128 256; do
            mkdir -p "AppDir/usr/share/icons/hicolor/${size}x${size}/apps"
            cp "assets/icons/png/${size}/${APP_ID}.png" "AppDir/usr/share/icons/hicolor/${size}x${size}/apps/"
          done

          # Desktop file and icon symlinks at AppDir root (required by AppImage spec)
          ln -s "usr/share/applications/${APP_ID}.desktop" "AppDir/${APP_ID}.desktop"
          ln -s "usr/share/icons/hicolor/scalable/apps/${APP_ID}.svg" "AppDir/${APP_ID}.svg"
          # .DirIcon is used as the AppImage icon
          ln -s "usr/share/icons/hicolor/scalable/apps/${APP_ID}.svg" AppDir/.DirIcon

      - name: Create AppRun script
        run: |
          printf '%s\n' '#!/bin/bash' > AppDir/AppRun
          printf '%s\n' '# AppRun for Hangar, a GTK4 + libadwaita app' >> AppDir/AppRun
          printf '%s\n' '#' >> AppDir/AppRun
          printf '%s\n' '# Hangar does NOT bundle GTK4/libadwaita libraries. It uses the' >> AppDir/AppRun
          printf '%s\n' '# host system libraries. Minimum: GTK 4.12 and libadwaita 1.5,' >> AppDir/AppRun
          printf '%s\n' '# i.e. GNOME 45+ (Fedora 39+, Ubuntu 23.10+, etc).' >> AppDir/AppRun
          printf '%s\n' '#' >> AppDir/AppRun
          printf '%s\n' '# This is intentional: bundling GTK4/libadwaita from the build' >> AppDir/AppRun
          printf '%s\n' '# environment (Ubuntu 24.04) causes theme/rendering failures on' >> AppDir/AppRun
          printf '%s\n' '# newer distros due to library version mismatches.' >> AppDir/AppRun
          printf '%s\n' '#' >> AppDir/AppRun
          printf '%s\n' '# Video also needs the host GStreamer 1.20+. Unlike the media' >> AppDir/AppRun
          printf '%s\n' '# backend GTK used to dlopen, this one is linked in, so its' >> AppDir/AppRun
          printf '%s\n' '# absence stops the binary from starting at all rather than' >> AppDir/AppRun
          printf '%s\n' '# just disabling video. Hence the check below.' >> AppDir/AppRun
          printf '%s\n' '' >> AppDir/AppRun
          printf '%s\n' 'HERE="$(dirname "$(readlink -f "$0")")"' >> AppDir/AppRun
          printf '%s\n' '' >> AppDir/AppRun
          printf '%s\n' '# Make system data dirs available for icon and GSettings schema lookup,' >> AppDir/AppRun
          printf '%s\n' '# while also including our own data dir for the app icon and metainfo.' >> AppDir/AppRun
          printf '%s\n' 'export XDG_DATA_DIRS="${HERE}/usr/share:/usr/share:/usr/local/share:${XDG_DATA_DIRS:-/usr/share}"' >> AppDir/AppRun
          printf '%s\n' '' >> AppDir/AppRun
          printf '%s\n' '# Probe for it with ldconfig, which lives in /usr/sbin and is therefore NOT' >> AppDir/AppRun
          printf '%s\n' '# on the PATH a desktop launcher hands us, hence the absolute fallbacks.' >> AppDir/AppRun
          printf '%s\n' '# If no ldconfig can be found at all the probe proves nothing, and a probe' >> AppDir/AppRun
          printf '%s\n' '# that proves nothing must never be the reason the app refuses to start.' >> AppDir/AppRun
          printf '%s\n' 'LDCONFIG=""' >> AppDir/AppRun
          printf '%s\n' 'for candidate in ldconfig /sbin/ldconfig /usr/sbin/ldconfig; do' >> AppDir/AppRun
          printf '%s\n' '  if command -v "$candidate" >/dev/null 2>&1; then' >> AppDir/AppRun
          printf '%s\n' '    LDCONFIG="$candidate"' >> AppDir/AppRun
          printf '%s\n' '    break' >> AppDir/AppRun
          printf '%s\n' '  fi' >> AppDir/AppRun
          printf '%s\n' 'done' >> AppDir/AppRun
          printf '%s\n' '' >> AppDir/AppRun
          printf '%s\n' 'if [ -n "$LDCONFIG" ] && ! "$LDCONFIG" -p 2>/dev/null | grep -q "libgstgl-1\.0\.so\.0"; then' >> AppDir/AppRun
          printf '%s\n' '  echo "Hangar: the host GStreamer libraries are missing." >&2' >> AppDir/AppRun
          printf '%s\n' '  echo "  Debian/Ubuntu: sudo apt install libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 libgstreamer-gl1.0-0 gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav" >&2' >> AppDir/AppRun
          printf '%s\n' '  echo "  Fedora: sudo dnf install gstreamer1 gstreamer1-plugins-base gstreamer1-plugins-good gstreamer1-plugins-bad-free gstreamer1-libav" >&2' >> AppDir/AppRun
          printf '%s\n' '  exit 1' >> AppDir/AppRun
          printf '%s\n' 'fi' >> AppDir/AppRun
          printf '%s\n' '' >> AppDir/AppRun
          printf '%s\n' 'exec "${HERE}/usr/bin/hangar" "$@"' >> AppDir/AppRun
          chmod +x AppDir/AppRun

      - name: Determine update channel
        id: update-channel
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "update_info=gh-releases-zsync|sethcottle|hangar|latest|Hangar*.AppImage.zsync" >> $GITHUB_OUTPUT
            echo "output_name=Hangar-x86_64.AppImage" >> $GITHUB_OUTPUT
          else
            echo "update_info=gh-releases-zsync|sethcottle|hangar|nightly|Hangar*.AppImage.zsync" >> $GITHUB_OUTPUT
            echo "output_name=Hangar-nightly-x86_64.AppImage" >> $GITHUB_OUTPUT
          fi

      - name: Build AppImage
        run: |
          # Build the AppImage using appimagetool directly.
          # No linuxdeploy = no automatic library bundling.
          # Hangar relies on the host system's GTK4 + libadwaita.
          #
          # --appimage-extract-and-run: required in CI (no FUSE available)
          # -u: update information for delta updates via zsync
          # The output name is explicit so the nightly artifact is
          # distinct from the release one; the zsync file inherits it.
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run \
            -u "${{ steps.update-channel.outputs.update_info }}" \
            AppDir "${{ steps.update-channel.outputs.output_name }}"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: hangar-appimage
          path: |
            Hangar*.AppImage
            Hangar*.AppImage.zsync

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-flatpak, build-appimage]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Determine release type
        id: release-type
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "is_nightly=false" >> $GITHUB_OUTPUT
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
            echo "tag_name=v${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            DATE=$(date -u +%Y-%m-%d)
            echo "is_nightly=true" >> $GITHUB_OUTPUT
            echo "version=nightly" >> $GITHUB_OUTPUT
            echo "tag_name=nightly" >> $GITHUB_OUTPUT
            echo "date=$DATE" >> $GITHUB_OUTPUT
            echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          fi

      - name: Download Flatpak artifact
        uses: actions/download-artifact@v8
        with:
          name: hangar-flatpak

      - name: Download AppImage artifact
        uses: actions/download-artifact@v8
        with:
          name: hangar-appimage

      - name: Delete existing nightly release
        if: steps.release-type.outputs.is_nightly == 'true'
        run: gh release delete nightly --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete existing nightly tag
        if: steps.release-type.outputs.is_nightly == 'true'
        run: git push --delete origin nightly || true

      - name: Create nightly release
        if: steps.release-type.outputs.is_nightly == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: "Nightly ${{ steps.release-type.outputs.date }} (${{ steps.release-type.outputs.short_sha }})"
          body: |
            ## Nightly Build

            **Date:** ${{ steps.release-type.outputs.date }}
            **Commit:** ${{ github.sha }}

            This is an automated nightly build from the latest `main` branch. It may be unstable.

            ### Downloads

            - **Flatpak**: `hangar-nightly.flatpak`. Install with `flatpak install hangar-nightly.flatpak`
            - **AppImage**: Make executable and run

            ### Authentication

            Hangar uses OAuth for authentication. An app password fallback is also available. Create one at [bsky.app/settings/app-passwords](https://bsky.app/settings/app-passwords).
          files: |
            hangar*.flatpak
            Hangar*.AppImage
            Hangar*.AppImage.zsync
          draft: false
          prerelease: true

      - name: Create versioned release
        if: steps.release-type.outputs.is_nightly == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.release-type.outputs.version }}
          name: Hangar v${{ steps.release-type.outputs.version }}
          body: |
            ## Hangar v${{ steps.release-type.outputs.version }}

            ### Downloads

            - **Flatpak**: `hangar.flatpak`. Install with `flatpak install hangar.flatpak`
            - **AppImage**: Make executable and run

            ### Authentication

            Hangar uses OAuth for authentication. An app password fallback is also available. Create one at [bsky.app/settings/app-passwords](https://bsky.app/settings/app-passwords).
          files: |
            hangar*.flatpak
            Hangar*.AppImage
            Hangar*.AppImage.zsync
          draft: false
          prerelease: false

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          APPIMAGE=$(ls Hangar*.AppImage)
          ZSYNC=$(ls Hangar*.AppImage.zsync)
          # The local name is channel-dependent since the bundles went
          # channel-distinct; the AppImage globs already cover theirs.
          FLATPAK=$(ls hangar*.flatpak)

          if [ "${{ steps.release-type.outputs.is_nightly }}" == "true" ]; then
            # Nightly builds use -nightly suffix
            aws s3 cp "$FLATPAK" s3://${{ secrets.R2_BUCKET_NAME }}/hangar/releases/hangar-nightly.flatpak \
              --endpoint-url ${{ secrets.R2_ENDPOINT_URL }}
            aws s3 cp "$APPIMAGE" s3://${{ secrets.R2_BUCKET_NAME }}/hangar/releases/Hangar-nightly-x86_64.AppImage \
              --endpoint-url ${{ secrets.R2_ENDPOINT_URL }}
            aws s3 cp "$ZSYNC" s3://${{ secrets.R2_BUCKET_NAME }}/hangar/releases/Hangar-nightly-x86_64.AppImage.zsync \
              --endpoint-url ${{ secrets.R2_ENDPOINT_URL }}
          else
            # Versioned releases use standard names
            aws s3 cp "$FLATPAK" s3://${{ secrets.R2_BUCKET_NAME }}/hangar/releases/hangar.flatpak \
              --endpoint-url ${{ secrets.R2_ENDPOINT_URL }}
            aws s3 cp "$APPIMAGE" s3://${{ secrets.R2_BUCKET_NAME }}/hangar/releases/Hangar-x86_64.AppImage \
              --endpoint-url ${{ secrets.R2_ENDPOINT_URL }}
            aws s3 cp "$ZSYNC" s3://${{ secrets.R2_BUCKET_NAME }}/hangar/releases/Hangar-x86_64.AppImage.zsync \
              --endpoint-url ${{ secrets.R2_ENDPOINT_URL }}
          fi
