# SPDX-License-Identifier: MPL-2.0

[package]
name = "hangar"
version = "0.1.0"
edition = "2024"
authors = ["Seth Cottle"]
license = "MPL-2.0"
description = "A native Bluesky client for Linux"
repository = "https://github.com/sethcottle/hangar"
keywords = ["bluesky", "atproto", "gtk", "gnome", "social"]
categories = ["gui"]
# Set by gst-plugin-gtk4 0.15, which is the highest MSRV in the tree.
rust-version = "1.92"

[dependencies]
gtk4 = { version = "0.11", features = ["v4_14"] }
libadwaita = { version = "0.9", features = ["v1_5", "gtk_v4_10"] }
gstreamer = "0.25"
# gtk4paintablesink, registered statically at startup so users do not have to
# install gstreamer1.0-gtk4 separately. gtk_v4_14 replaces the crate's
# gtk_v4_10 default to match this crate's own gtk4 feature.
#
# The GL platform features let the sink negotiate GL memory, so frames
# reach GTK as GPU textures instead of per-frame CPU uploads; on NVIDIA
# the upload path stalls the frame clock and scrolling next to a playing
# video janks. The needed pkg-config modules ship in the same dev
# packages every build environment already installs, and the sink still
# falls back to the videoconvert path where GL negotiation fails.
# dmabuf stays off: it raises the runtime GStreamer floor from 1.20 to
# 1.24, which the AppImage's host promise does not allow.
gst-plugin-gtk4 = { version = "0.15", default-features = false, features = ["gtk_v4_14", "waylandegl", "x11egl", "x11glx"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
atrium-api = { version = "0.25", features = ["agent", "namespace-chatbsky"] }
atrium-common = "0.1"
atrium-identity = "0.1"
atrium-oauth = { version = "0.1", features = ["default-client"] }
atrium-xrpc-client = { version = "0.5", features = ["reqwest"] }
# rustls-tls is asked for here but is not what ships. atrium-oauth's
# default-client and atrium-xrpc-client's own defaults both turn on
# reqwest/default-tls, and reqwest picks native-tls whenever both backends
# are enabled, so the binary links libssl and libcrypto and the rustls code
# rides along unused. Getting to a real rustls build means an HttpClient
# impl for atrium-oauth and rustls-tls-native-roots for private-CA PDSes.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = { version = "0.3", default-features = false }
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
open = "5"
thiserror = "2"
secret-service = { version = "4", features = ["rt-tokio-crypto-rust"] }
chrono = "0.4"
once_cell = "1"
rusqlite = { version = "0.33", features = ["bundled"] }
dirs = "5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
regex = "1"
unicode-segmentation = "1.12.0"

[build-dependencies]
# Compiles the bundled symbolic icons into a gresource; needs the
# glib-compile-resources binary, which every build environment that can
# build GTK already has.
glib-build-tools = "0.22"

[features]
devel = []

[profile.release]
lto = true
codegen-units = 1
strip = true
