# SPDX-License-Identifier: MPL-2.0

[package]
name = "hangar"
version = "0.1.0"
edition = "2024"
authors = ["Seth Cottle"]
license = "MPL-2.0"
description = "A native Bluesky client for Linux"
repository = "https://github.com/sethcottle/hangar"
keywords = ["bluesky", "atproto", "gtk", "gnome", "social"]
categories = ["gui"]
# Set by gst-plugin-gtk4 0.15, which is the highest MSRV in the tree.
rust-version = "1.92"

[dependencies]
gtk4 = { version = "0.11", features = ["v4_14"] }
libadwaita = { version = "0.9", features = ["v1_5", "gtk_v4_10"] }
gstreamer = "0.25"
# gtk4paintablesink, registered statically at startup so users do not have to
# install gstreamer1.0-gtk4 separately. gtk_v4_14 replaces the crate's
# gtk_v4_10 default to match this crate's own gtk4 feature.
#
# The GL features (waylandegl/x11egl/x11glx) and dmabuf are deliberately left
# off: they add pkg-config modules to every packaging target, and dmabuf would
# raise the runtime GStreamer floor from 1.20 to 1.24. The sink falls back to a
# videoconvert path, which renders correctly.
gst-plugin-gtk4 = { version = "0.15", default-features = false, features = ["gtk_v4_14"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
atrium-api = { version = "0.25", features = ["agent", "namespace-chatbsky"] }
atrium-common = "0.1"
atrium-identity = "0.1"
atrium-oauth = { version = "0.1", features = ["default-client"] }
atrium-xrpc-client = { version = "0.5", features = ["reqwest"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = { version = "0.3", default-features = false }
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
open = "5"
thiserror = "2"
secret-service = { version = "4", features = ["rt-tokio-crypto-rust"] }
chrono = "0.4"
once_cell = "1"
rusqlite = { version = "0.33", features = ["bundled"] }
dirs = "5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
regex = "1"
unicode-segmentation = "1.12.0"

[build-dependencies]
# Compiles the bundled symbolic icons into a gresource; needs the
# glib-compile-resources binary, which every build environment that can
# build GTK already has.
glib-build-tools = "0.22"

[features]
devel = []

# No build dependencies needed currently
# Blueprint compilation handled via build.rs if blueprint-compiler is available

[profile.release]
lto = true
codegen-units = 1
strip = true
